# 复制为 config.yaml，修改后执行：bash simple_srt_service/start.sh

server:
  host: "0.0.0.0"
  port: 12045

gpu:
  visible_devices: "5"

# 模型在服务启动时加载，后续请求复用同一实例。
alignment_engine:
  gpu_memory_utilization: 0.65
  max_inference_batch_size: 32
  max_new_tokens: 2048
  flash_attention: false
  startup_timeout_seconds: 900
  # auto 会根据 SRT 文字自动判断 Chinese / English / Japanese。
  language: "auto"

models:
  root: "/data/yb/Code/models"

storage:
  # 相对路径以 simple_srt_service 目录为基准。
  data_dir: "./data"
  max_upload_mb: 4096

